<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fragrance World SA Collection Hub</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --border-color: #334155;
            
            /* South African Season Colors */
            --color-summer: #f59e0b;       /* Dec - Feb */
            --color-spring-autumn: #ea580c;/* Sep - Nov & Mar - May */
            --color-winter: #2563eb;       /* Jun - Aug */
            --color-year-round: #10b981;   /* All Year */
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            padding: 2rem;
            line-height: 1.5;
        }

        header {
            max-width: 1400px;
            margin: 0 auto 2rem auto;
            text-align: center;
        }

        h1 {
            font-size: 2.2rem;
            margin-bottom: 0.5rem;
            color: var(--text-primary);
        }

        p.subtitle {
            color: var(--text-secondary);
            margin-bottom: 1.5rem;
            font-size: 0.95rem;
        }

        .controls-container {
            max-width: 1400px;
            margin: 0 auto 2rem auto;
        }

        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            justify-content: center;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .search-box {
            padding: 0.75rem 1rem;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background-color: var(--card-bg);
            color: var(--text-primary);
            font-size: 1rem;
            width: 100%;
            max-width: 400px;
            outline: none;
        }

        .search-box:focus {
            border-color: #38bdf8;
        }

        .filter-section {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 1rem;
            margin-bottom: 1rem;
        }

        .filter-section-title {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            margin-bottom: 0.75rem;
            display: block;
        }

        .filter-buttons {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
            justify-content: flex-start;
        }

        .filter-row {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            align-items: center;
            margin-bottom: 1rem;
        }

        .btn {
            background-color: var(--card-bg);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
            padding: 0.6rem 1.1rem;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 0.85rem;
        }

        .btn:hover, .btn.active {
            font-weight: bold;
        }

        .btn-details {
            background-color: #38bdf8;
            color: #0f172a;
            border: 1px solid #38bdf8;
            padding: 0.6rem 1.1rem;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
            transition: all 0.2s ease;
            text-decoration: none;
            display: inline-block;
        }

        .btn-details:hover {
            background-color: #06b6d4;
            border-color: #06b6d4;
        }

        /* Color-coded filter button active states */
        .btn[data-category="All"].active { background-color: #38bdf8; color: #0f172a; border-color: #38bdf8; }
        .btn[data-category="Summer"].active { background-color: var(--color-summer); color: #0f172a; border-color: var(--color-summer); }
        .btn[data-category="Winter"].active { background-color: var(--color-winter); color: #ffffff; border-color: var(--color-winter); }
        .btn[data-category="SpringAutumn"].active { background-color: var(--color-spring-autumn); color: #ffffff; border-color: var(--color-spring-autumn); }
        .btn[data-category="Year-Round"].active { background-color: var(--color-year-round); color: #0f172a; border-color: var(--color-year-round); }

        /* Concentration filter */
        .btn[data-concentration="EDP"].active { background-color: #8b5cf6; color: #ffffff; border-color: #8b5cf6; }
        .btn[data-concentration="Parfum"].active { background-color: #ec4899; color: #ffffff; border-color: #ec4899; }
        .btn[data-concentration="EDT"].active { background-color: #06b6d4; color: #0f172a; border-color: #06b6d4; }

        /* Brand filter */
        .btn[data-brand].active { background-color: #f59e0b; color: #0f172a; border-color: #f59e0b; }

        .select-dropdown {
            padding: 0.6rem 1rem;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background-color: var(--card-bg);
            color: var(--text-primary);
            font-size: 0.9rem;
            cursor: pointer;
            outline: none;
        }

        .select-dropdown:focus {
            border-color: #38bdf8;
        }

        .select-dropdown option {
            background-color: var(--card-bg);
            color: var(--text-primary);
        }

        .fragrance-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 1.5rem;
            max-width: 1400px;
            margin: 0 auto;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            border: 1px solid var(--border-color);
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            position: relative;
            overflow: hidden;
        }

        /* Top border accent line matching primary season */
        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
        }

        .card.theme-summer::before { background-color: var(--color-summer); }
        .card.theme-winter::before { background-color: var(--color-winter); }
        .card.theme-spring-autumn::before { background-color: var(--color-spring-autumn); }
        .card.theme-year-round::before { background-color: var(--color-year-round); }

        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }

        .card-header {
            margin-bottom: 0.8rem;
        }

        .brand {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-secondary);
            font-weight: bold;
        }

        .title-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 0.5rem;
            margin-top: 0.25rem;
        }

        .name {
            font-size: 1.2rem;
            font-weight: 600;
        }

        .size-tag {
            background-color: var(--border-color);
            font-size: 0.75rem;
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
            white-space: nowrap;
        }

        .concentration-badge {
            display: inline-block;
            background-color: var(--border-color);
            font-size: 0.7rem;
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
            margin-left: 0.5rem;
            font-weight: 600;
        }

        .clone-info {
            color: var(--text-secondary);
            font-size: 0.85rem;
            margin-bottom: 0.8rem;
            font-style: italic;
        }

        .profile {
            font-size: 0.9rem;
            margin-bottom: 1rem;
            line-height: 1.4;
        }

        /* Color-coded Versatility Badges */
        .versatility-badge {
            display: inline-block;
            padding: 0.3rem 0.8rem;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 600;
            margin-bottom: 1rem;
        }

        .badge-summer { background-color: rgba(245, 158, 11, 0.15); color: var(--color-summer); border: 1px solid rgba(245, 158, 11, 0.3); }
        .badge-winter { background-color: rgba(37, 99, 235, 0.15); color: var(--color-winter); border: 1px solid rgba(37, 99, 235, 0.3); }
        .badge-spring-autumn { background-color: rgba(234, 88, 12, 0.15); color: var(--color-spring-autumn); border: 1px solid rgba(234, 88, 12, 0.3); }
        .badge-year-round { background-color: rgba(16, 185, 129, 0.15); color: var(--color-year-round); border: 1px solid rgba(16, 185, 129, 0.3); }

        .spray-guides {
            border-top: 1px solid var(--border-color);
            padding-top: 0.8rem;
            margin-top: auto;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.4rem;
            text-align: center;
            margin-bottom: 1rem;
        }

        .spray-item {
            background-color: rgba(0, 0, 0, 0.25);
            padding: 0.5rem 0.25rem;
            border-radius: 6px;
        }

        .spray-item .season {
            font-size: 0.65rem;
            text-transform: uppercase;
            display: block;
            font-weight: 700;
            margin-bottom: 2px;
        }

        /* Color-coded spray column headers with SA month hints */
        .season-summer { color: var(--color-summer); }
        .season-spring-autumn { color: var(--color-spring-autumn); }
        .season-winter { color: var(--color-winter); }

        .spray-item .count {
            font-size: 0.8rem;
            font-weight: bold;
            color: var(--text-primary);
        }

        .card-actions {
            display: flex;
            gap: 0.5rem;
            justify-content: center;
        }

        .no-results {
            grid-column: 1 / -1;
            text-align: center;
            color: var(--text-secondary);
            padding: 3rem;
            font-size: 1.1rem;
        }

        .results-info {
            max-width: 1400px;
            margin: 0 auto 1rem auto;
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        /* Detail Page Styles */
        .detail-page {
            display: none;
            max-width: 1000px;
            margin: 0 auto;
        }

        .detail-page.active {
            display: block;
        }

        .detail-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }

        .back-btn {
            background-color: var(--card-bg);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
            padding: 0.6rem 1.2rem;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.2s ease;
        }

        .back-btn:hover {
            border-color: #38bdf8;
            color: #38bdf8;
        }

        .detail-content {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 2rem;
        }

        .detail-content h2 {
            font-size: 1.8rem;
            margin-bottom: 1rem;
            color: var(--text-primary);
        }

        .detail-content h3 {
            font-size: 1.2rem;
            margin-top: 1.5rem;
            margin-bottom: 0.8rem;
            color: #38bdf8;
        }

        .detail-content ul {
            list-style: none;
            padding-left: 1rem;
            margin-bottom: 1rem;
        }

        .detail-content li {
            padding: 0.4rem 0;
            color: var(--text-primary);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .detail-content li:last-child {
            border-bottom: none;
        }

        .detail-content li strong {
            color: #38bdf8;
        }

        .notes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .note-card {
            background-color: rgba(56, 189, 248, 0.1);
            border: 1px solid rgba(56, 189, 248, 0.3);
            border-radius: 8px;
            padding: 1.5rem;
        }

        .note-card h4 {
            color: #38bdf8;
            margin-bottom: 0.8rem;
            font-size: 1rem;
        }

        .note-card p {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        .price-tag {
            background-color: rgba(16, 185, 129, 0.15);
            color: var(--color-year-round);
            border: 1px solid rgba(16, 185, 129, 0.3);
            padding: 1rem;
            border-radius: 8px;
            margin-top: 2rem;
            font-size: 1.1rem;
            font-weight: 600;
        }

        .grid-list {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .gird-list-item {
            background-color: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--border-color);
            padding: 1rem;
            border-radius: 8px;
        }

        .gird-list-item strong {
            color: #38bdf8;
            display: block;
            margin-bottom: 0.5rem;
        }

        .gird-list-item span {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <!-- Main Grid View -->
    <div id="gridView" class="active">
        <header>
            <h1>Fragrance World SA Database</h1>
            <p class="subtitle">Categorized for Southern Hemisphere seasons & climate conditions</p>
        </header>

        <div class="controls-container">
            <div class="controls">
                <input type="text" id="searchInput" class="search-box" placeholder="Search by name, clone, or scent notes...">
            </div>

            <!-- Season Filter -->
            <div class="filter-section">
                <span class="filter-section-title">🌍 Season Filter</span>
                <div class="filter-buttons">
                    <button class="btn active" data-category="All" onclick="filterCategory('All', this)">All Seasons</button>
                    <button class="btn" data-category="Summer" onclick="filterCategory('Summer', this)">☀️ Summer (Dec–Feb)</button>
                    <button class="btn" data-category="SpringAutumn" onclick="filterCategory('SpringAutumn', this)">🍂 Spring & Autumn</button>
                    <button class="btn" data-category="Winter" onclick="filterCategory('Winter', this)">❄️ Winter (Jun–Aug)</button>
                    <button class="btn" data-category="Year-Round" onclick="filterCategory('Year-Round', this)">🔄 Year-Round</button>
                </div>
            </div>

            <!-- Concentration & Brand Filter -->
            <div class="filter-section">
                <div class="filter-row">
                    <div>
                        <span class="filter-section-title">💎 Concentration</span>
                        <div class="filter-buttons">
                            <button class="btn active" data-concentration="All" onclick="filterConcentration('All', this)">All Types</button>
                            <button class="btn" data-concentration="EDP" onclick="filterConcentration('EDP', this)">EDP</button>
                            <button class="btn" data-concentration="Parfum" onclick="filterConcentration('Parfum', this)">Parfum</button>
                            <button class="btn" data-concentration="EDT" onclick="filterConcentration('EDT', this)">EDT</button>
                        </div>
                    </div>
                    <div>
                        <span class="filter-section-title">🏷️ Brand</span>
                        <div class="filter-buttons">
                            <button class="btn active" data-brand="All" onclick="filterBrand('All', this)">All Brands</button>
                            <button class="btn" data-brand="Fragrance World" onclick="filterBrand('Fragrance World', this)">Fragrance World</button>
                            <button class="btn" data-brand="Lattafa" onclick="filterBrand('Lattafa', this)">Lattafa</button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Sorting -->
            <div class="filter-section">
                <span class="filter-section-title">📊 Sort By</span>
                <div class="filter-buttons">
                    <select id="sortBy" class="select-dropdown" onchange="updateSort()">
                        <option value="name-asc">Name (A-Z)</option>
                        <option value="name-desc">Name (Z-A)</option>
                        <option value="brand-asc">Brand (A-Z)</option>
                        <option value="concentration">Concentration (Highest First)</option>
                        <option value="newest">Newest Added</option>
                    </select>
                </div>
            </div>
        </div>

        <div class="results-info" id="resultsInfo"></div>
        <main class="fragrance-grid" id="fragranceGrid"></main>
    </div>

    <!-- Detail Page View -->
    <div id="detailView" class="detail-page">
        <div class="detail-header">
            <button class="back-btn" onclick="goBack()">← Back to Collection</button>
            <h1 id="detailTitle"></h1>
        </div>
        <div class="detail-content" id="detailContent"></div>
    </div>

        let activeCategory = 'All';
        let activeConcentration = 'All';
        let activeBrand = 'All';
        let searchQuery = '';
        let sortBy = 'name-asc';

        function renderFragrances() {
            const grid = document.getElementById('fragranceGrid');
            const resultsInfo = document.getElementById('resultsInfo');
            grid.innerHTML = '';

            let filtered = fragrances.filter(item => {
                const matchesCategory = activeCategory === 'All' || item.tags.includes(activeCategory);
                const matchesConcentration = activeConcentration === 'All' || item.concentration === activeConcentration;
                const matchesBrand = activeBrand === 'All' || item.brand === activeBrand;
                const query = searchQuery.toLowerCase();
                const matchesSearch = item.name.toLowerCase().includes(query) ||
                                      item.inspiredBy.toLowerCase().includes(query) ||
                                      item.mainProfile.toLowerCase().includes(query) ||
                                      item.brand.toLowerCase().includes(query);
                return matchesCategory && matchesConcentration && matchesBrand && matchesSearch;
            });

            // Apply sorting
            filtered = sortFragrances(filtered);

            // Update results info
            resultsInfo.textContent = `Showing ${filtered.length} fragrance${filtered.length !== 1 ? 's' : ''}`;

            if (filtered.length === 0) {
                grid.innerHTML = `<div class="no-results">No fragrances match your search criteria.</div>`;
                return;
            }

            filtered.forEach(item => {
                const card = document.createElement('div');
                card.className = `card ${item.themeClass}`;
                card.innerHTML = `
                    <div>
                        <div class="card-header">
                            <span class="brand">${item.brand}</span>
                            <div class="title-row">
                                <h2 class="name">${item.name}</h2>
                                <span class="size-tag">${item.bottleSize} · <span class="concentration-badge">${item.concentration}</span></span>
                            </div>
                        </div>
                        <div class="clone-info">Inspired by: <strong>${item.inspiredBy}</strong></div>
                        <div class="versatility-badge ${item.badgeClass}">${item.versatility}</div>
                        <div class="profile">${item.mainProfile}</div>
                    </div>
                    <div class="spray-guides">
                        <div class="spray-item">
                            <span class="season season-summer">Summer<br><small>(Dec–Feb)</small></span>
                            <span class="count">${item.sprays.summer} sprays</span>
                        </div>
                        <div class="spray-item">
                            <span class="season season-spring-autumn">Spring / Autumn<br><small>(Sep–Nov / Mar–May)</small></span>
                            <span class="count">${item.sprays.springAutumn} sprays</span>
                        </div>
                        <div class="spray-item">
                            <span class="season season-winter">Winter<br><small>(Jun–Aug)</small></span>
                            <span class="count">${item.sprays.winter} sprays</span>
                        </div>
                    </div>
                    <div class="card-actions">
                        <button class="btn-details" onclick="viewDetails(${item.id})">View Details</button>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function viewDetails(id) {
            const fragrance = fragrances.find(f => f.id === id);
            if (!fragrance) return;

            document.getElementById('gridView').classList.remove('active');
            document.getElementById('detailView').classList.add('active');
            document.getElementById('detailTitle').textContent = fragrance.name;

            const detailContent = document.getElementById('detailContent');
            detailContent.innerHTML = `
                <div style="margin-bottom: 2rem;">
                    <span style="color: var(--text-secondary); font-size: 0.9rem; text-transform: uppercase;">${fragrance.brand}</span>
                    <p style="font-size: 1.1rem; margin: 0.5rem 0; color: var(--text-primary);">${fragrance.bottleSize} • ${fragrance.concentration}</p>
                </div>

                <h3>🎯 Olfactory Profile</h3>
                <div class="notes-grid">
                    <div class="note-card">
                        <h4>Top Notes</h4>

                    </div>
                    <div class="note-card">

                <p style="line-height: 1.6; color: var(--text-secondary); background-color: rgba(245, 158, 11, 0.05); padding: 1rem; border-radius: 8px; border-left: 4px solid var(--color-summer);">
                    ${fragrance.salonSettings}

                <div class="grid-list">
                    <div class="gird-list-item">
                        <strong>☀️ Summer (Dec–Feb)</strong>

                        <strong>🍂 Spring/Autumn (Sep–Nov / Mar–May)</strong>
                        <span>${fragrance.sprays.springAutumn} sprays</span>
                    </div>
                    <div class="gird-list-item">
                        <strong>❄️ Winter (Jun–Aug)</strong>
                        <span>${fragrance.sprays.winter} sprays</span>
                    </div>
                </div>

                <div class="price-tag">
                    💰 Current Price: ${fragrance.price}
                </div>
            `;

            window.scrollTo(0, 0);
        }

        function goBack() {
            document.getElementById('gridView').classList.add('active');
            document.getElementById('detailView').classList.remove('active');
            window.scrollTo(0, 0);
        }

        function sortFragrances(items) {
            const sorted = [...items];
            switch(sortBy) {
                case 'name-asc':
                    sorted.sort((a, b) => a.name.localeCompare(b.name));
                    break;
                case 'name-desc':
                    sorted.sort((a, b) => b.name.localeCompare(a.name));
                    break;
                case 'brand-asc':
                    sorted.sort((a, b) => a.brand.localeCompare(b.brand) || a.name.localeCompare(b.name));
                    break;
                case 'concentration':
                    const concentrationOrder = { 'Parfum': 0, 'EDP': 1, 'EDT': 2 };
                    sorted.sort((a, b) => (concentrationOrder[a.concentration] || 3) - (concentrationOrder[b.concentration] || 3));
                    break;
                case 'newest':
                    sorted.reverse();
                    break;
            }
            return sorted;
        }

        function filterCategory(category, button) {
            activeCategory = category;
            document.querySelectorAll('[data-category]').forEach(btn => btn.classList.remove('active'));
            button.classList.add('active');
            renderFragrances();
        }

        function filterConcentration(concentration, button) {
            activeConcentration = concentration;
            document.querySelectorAll('[data-concentration]').forEach(btn => btn.classList.remove('active'));
            button.classList.add('active');
            renderFragrances();
        }

        function filterBrand(brand, button) {
            activeBrand = brand;
            document.querySelectorAll('[data-brand]').forEach(btn => btn.classList.remove('active'));
            button.classList.add('active');
            renderFragrances();
        }

        function updateSort() {
            sortBy = document.getElementById('sortBy').value;
            renderFragrances();
        }

        document.getElementById('searchInput').addEventListener('input', (e) => {
            searchQuery = e.target.value;
            renderFragrances();
        });

        renderFragrances();
    </script>
